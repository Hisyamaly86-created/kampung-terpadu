function getCfg(){
 var u=SUPABASE_URL,k=SUPABASE_ANON_KEY;
 if(!u||u.indexOf('YOUR_')===0||!k||k.indexOf('YOUR_')===0){
  try{var raw=localStorage.getItem(CFG_KEY);if(raw){var c=JSON.parse(raw);if(c.url&&c.key){u=c.url;k=c.key}}}catch(e){}
 }
 return{url:u,key:k,ready:!!(u&&k&&u.indexOf('https://')===0&&k.indexOf('YOUR_')!==0)};
}
function initSb(){
 var cfg=getCfg();
 if(!cfg.ready||!window.supabase||!window.supabase.createClient){sb=null;return false}
 sb=window.supabase.createClient(cfg.url,cfg.key);
 return true;
}
function saveCfg(){
 var url=v('cfgUrl').trim().replace(/\/+$/,''),key=v('cfgKey').trim();
 if(url.indexOf('https://')!==0||!key){setMsg('Masukkan URL https://... dan Anon/Publishable Key yang valid.');render();return}
 try{localStorage.setItem(CFG_KEY,JSON.stringify({url:url,key:key}))}catch(e){}
 CFG_OPEN=false;clearMsg();initSb();boot();
}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

async function loadUserAndData(authUser){
 BUSY=true;render();
 try{
  var pr=await sb.from('profiles').select('*').eq('id',authUser.id).maybeSingle();
  if(pr.error)throw pr.error;
  var prof=pr.data;
  if(!prof){
   U={id:authUser.id,email:authUser.email||'',nama:(authUser.email||'User').split('@')[0],role:'viewer',kk_id:null};
  }else{
   U={id:prof.id,email:prof.email||authUser.email||'',nama:prof.nama||prof.email||'User',role:prof.role||'viewer',kk_id:prof.kk_id||null};
  }
  if(TAB==='db'&&!A())TAB='beranda';
  await loadAll();
 }catch(e){
  setMsg('Gagal memuat profil/data: '+(e.message||e));
 }finally{
  BUSY=false;render();
 }
}

async function loadAll(){
 if(!sb||!U)return;
 var reqs=[
  sb.from('kk').select('*').order('id',{ascending:true}),
  sb.from('kas').select('*').order('tgl',{ascending:false}).order('id',{ascending:false}),
  sb.from('ronda').select('*').order('id',{ascending:true}),
  sb.from('pinjam').select('*').order('id',{ascending:true}),
  sb.from('info').select('*').order('tgl',{ascending:false}).order('id',{ascending:false})
 ];
 if(A())reqs.push(sb.from('profiles').select('*').order('created_at',{ascending:true}));
 var out=await Promise.all(reqs);
 for(var i=0;i<out.length;i++){if(out[i].error)throw out[i].error}
 D.kk=out[0].data||[];
 D.kas=out[1].data||[];
 D.ronda=out[2].data||[];
 D.pinjam=out[3].data||[];
 D.info=out[4].data||[];
 D.profiles=A()&&out[5]?(out[5].data||[]):[];
}

async function doAuth(){
 if(!sb){setMsg('Konfigurasi Supabase belum diisi.');render();return}
 var email=v('le').trim(),pass=v('lp'),nama=v('ln').trim();
 if(!email||!pass){setMsg('Email dan password wajib diisi.');render();return}
 if(AUTH_MODE==='signup'&&pass.length<6){setMsg('Password minimal 6 karakter.');render();return}
 BUSY=true;clearMsg();render();
 try{
  if(AUTH_MODE==='login'){
   var res=await sb.auth.signInWithPassword({email:email,password:pass});
   if(res.error)throw res.error;
   TAB='beranda';EDIT=null;SHARE=null;saveTab();
   await loadUserAndData(res.data.user);
  }else{
   var res2=await sb.auth.signUp({email:email,password:pass,options:{data:{nama:nama||email.split('@')[0]}}});
   if(res2.error)throw res2.error;
   if(res2.data&&res2.data.session&&res2.data.user){
    TAB='beranda';EDIT=null;SHARE=null;saveTab();
    await loadUserAndData(res2.data.user);
   }else{
    AUTH_MODE='login';
    setMsg('Pendaftaran berhasil! Silakan masuk dengan akun Anda.',true);
    BUSY=false;render();
   }
  }
 }catch(e){
  setMsg(e.message||'Gagal autentikasi.');
  BUSY=false;render();
 }
}

function kasFiltered(){

 });

function periodeLabel(){

function ang(p){var t=Number(p.tenor),pk=Number(p.pokok),bg=Number(p.bunga)||0;if(!Number.isFinite(t)||t<=0||!Number.isFinite(pk)||pk<=0)return 0;return Math.round(pk*(1+bg/100)/t)}

function buildKasPdfDoc(){
 if(!window.jspdf||!window.jspdf.jsPDF)throw new Error('Library PDF belum termuat. Pastikan koneksi internet aktif.');
 var p=PAPERS[PR.size]||PAPERS.A4;
 var doc=new window.jspdf.jsPDF({orientation:PR.ori,unit:'mm',format:[p.w,p.h]});
 if(typeof doc.autoTable!=='function')throw new Error('Plugin tabel PDF belum siap.');
 var rows=kasFiltered(),s=saldo(rows);
 var pw=doc.internal.pageSize.getWidth();
 doc.setFont('helvetica','bold');doc.setFontSize(14);
 doc.text('LAPORAN KEUANGAN KAS RT 03 / RW 05',14,16);
 doc.setFont('helvetica','normal');doc.setFontSize(10);
 doc.text('Periode: '+periodeLabel()+'   |   Dicetak: '+today()+'   |   Kertas: '+PR.size+' ('+(PR.ori==='landscape'?'Landscape':'Portrait')+')',14,22);
 doc.setDrawColor(47,125,79);doc.setLineWidth(0.5);doc.line(14,25,pw-14,25);

 doc.setFont('helvetica','bold');doc.setFontSize(pw<165?9:10);
 doc.text('Pemasukan: '+rp(s.m),14,32);
 doc.text('Pengeluaran: '+rp(s.k),pw/2,32,{align:'center'});
 doc.text('Saldo Akhir: '+rp(s.s),pw-14,32,{align:'right'});

 var body=rows.map(function(x,idx){
  return[idx+1,String(x.tgl||''),String(x.ket||''),x.jenis==='masuk'?'Pemasukan':'Pengeluaran',(x.jenis==='masuk'?'+ ':'- ')+rp(x.jml)];
 });
 if(!body.length)body=[['-','-','Belum ada transaksi pada periode ini','-','-']];

 doc.autoTable({
  startY:37,
  head:[['No','Tanggal','Keterangan','Jenis','Jumlah']],
  body:body,
  styles:{fontSize:9,cellPadding:2.5},
  headStyles:{fillColor:[47,125,79],textColor:255,fontStyle:'bold'},
  columnStyles:{0:{halign:'center',cellWidth:10},1:{cellWidth:24},3:{cellWidth:24},4:{halign:'right',cellWidth:34}},
  margin:{left:14,right:14},
  didDrawPage:function(){
   var str='Halaman '+doc.internal.getNumberOfPages();
   doc.setFontSize(8);doc.setTextColor(120);
   doc.text(str,pw-14,doc.internal.pageSize.getHeight()-8,{align:'right'});
   doc.setTextColor(0);
  }
 });

 var y=(doc.lastAutoTable?doc.lastAutoTable.finalY:50)+12;
 var ph=doc.internal.pageSize.getHeight();
 if(y+32>ph){doc.addPage();y=20}
 var c1=pw*0.27,c2=pw*0.73,halfW=Math.min(24,(pw-40)*0.18);
 doc.setFont('helvetica','normal');doc.setFontSize(10);
 doc.text('Mengetahui,',c1,y,{align:'center'});
 doc.text('Dicetak: '+today(),c2,y,{align:'center'});
 doc.setFont('helvetica','bold');
 doc.text('Ketua RT 03',c1,y+5,{align:'center'});
 doc.text('Bendahara RT 03',c2,y+5,{align:'center'});
 doc.setFont('helvetica','normal');
 doc.setDrawColor(40);doc.setLineWidth(0.3);
 [c1,c2].forEach(function(cx){
  doc.text('(',cx-halfW,y+24,{align:'center'});
  doc.line(cx-halfW+2.5,y+24.3,cx+halfW-2.5,y+24.3);
  doc.text(')',cx+halfW,y+24,{align:'center'});
 });
 return doc;
}

function downloadPdfKas(){
 var m=document.getElementById('pdfMsg');
 try{
  var doc=buildKasPdfDoc();
  var fn='Laporan-Kas-RT-'+today()+'.pdf';
  doc.save(fn);
  if(m)m.textContent='PDF berhasil diunduh: '+fn;
 }catch(e){
  if(m)m.textContent='Gagal membuat PDF: '+(e.message||e);
 }
}

async function sharePdfKas(){
 var m=document.getElementById('pdfMsg');
 try{
  var doc=buildKasPdfDoc();
  var fn='Laporan-Kas-RT-'+today()+'.pdf';
  var blob=doc.output('blob');
  var file=new File([blob],fn,{type:'application/pdf'});
  if(navigator.canShare&&navigator.share&&navigator.canShare({files:[file]})){
   await navigator.share({title:'Laporan Kas RT 03 / RW 05',text:'Laporan Keuangan Kas RT ('+periodeLabel()+')',files:[file]});
   if(m)m.textContent='PDF berhasil dibagikan.';
  }else{
   doc.save(fn);
   if(m)m.textContent='Browser ini belum mendukung bagikan file langsung — PDF telah diunduh ('+fn+'), silakan kirim manual ke WhatsApp.';
  }
 }catch(e){
  if(e&&e.name==='AbortError')return;
  if(m)m.textContent='Gagal membagikan PDF: '+(e.message||e);
 }
}

function downloadFile(name,content,mime){
 var blob=new Blob([content],{type:mime});
 var url=URL.createObjectURL(blob);
 var a=document.createElement('a');
 a.href=url;a.download=name;
 document.body.appendChild(a);a.click();document.body.removeChild(a);
 setTimeout(function(){URL.revokeObjectURL(url)},1000);
}

function downloadCsvKas(){

 }).join('\n');
 downloadFile('Laporan-Kas-RT-'+today()+'.csv',csv,'text/csv;charset=utf-8;');

 if(m)m.textContent='File CSV berhasil disimpan.';
}

async function saveKas(){
 var tgl=v('kt')||today(),ket=v('kk_').trim(),jenis=v('kj')==='keluar'?'keluar':'masuk',jml=Math.round(Number(v('kn')));
 if(!ket){setMsg('Keterangan transaksi wajib diisi.');render();return}
 if(!Number.isFinite(jml)||jml<=0){setMsg('Jumlah harus lebih dari 0.');render();return}
 if(DEMO){
  if(EDIT&&EDIT.t==='kas'){
   var item=D.kas.find(function(x){return x.id===EDIT.id});
   if(item){item.tgl=tgl;item.ket=ket;item.jenis=jenis;item.jml=jml}
   EDIT=null;setMsg('Transaksi demo diperbarui.',true);
  }else{
   D.kas.unshift({id:demoNid('kas'),tgl:tgl,ket:ket,jenis:jenis,jml:jml});

 }

   if(r2.error)throw r2.error;
   setMsg('Transaksi berhasil disimpan ke Supabase.',true);
  }
  await loadAll();
 }catch(e){setMsg('Gagal menyimpan kas: '+(e.message||e))}
 finally{BUSY=false;render()}
}

async function addPinjam(){

 if(!kk_id||!D.kk.some(function(k){return k.id===kk_id})){setMsg('Pilih peminjam yang valid.');render();return}

 if(!Number.isFinite(tenor)||tenor<1){setMsg('Tenor minimal 1 bulan.');render();return}
 if(!Number.isFinite(bunga)||bunga<0){setMsg('Jasa (%) tidak boleh negatif.');render();return}
 if(DEMO){D.pinjam.push({id:demoNid('pinjam'),kk_id:kk_id,tgl:today(),pokok:pokok,tenor:tenor,bunga:bunga,bayar:0});saveDemoData();setMsg('Pinjaman demo disimpan.',true);render();return}

function saveBackupFile(){
 var payload=JSON.stringify({exported_at:new Date().toISOString(),kk:D.kk,kas:D.kas,ronda:D.ronda,pinjam:D.pinjam,info:D.info},null,2);
 var fn='kampung-terpadu-backup-'+today()+'.json';
 downloadFile(fn,payload,'application/json;charset=utf-8;');
 var m=document.getElementById('dbMsg');
 if(m)m.textContent='Backup berhasil disimpan ke perangkat: '+fn;
}
function triggerRestore(){var el=document.getElementById('impFile');if(el){el.value='';el.click()}}
function handleRestoreFile(inp){
 var file=inp&&inp.files&&inp.files[0];if(!file)return;
 var r=new FileReader();
 r.onload=function(){restoreFromJsonText(String(r.result||''))};
 r.readAsText(file);
}
async function restoreFromJsonText(raw){
 var m=document.getElementById('dbMsg');
 try{
  var p=JSON.parse(raw);
  if(!p||!Array.isArray(p.kk)||!Array.isArray(p.kas)||!Array.isArray(p.ronda)||!Array.isArray(p.pinjam)||!Array.isArray(p.info))throw new Error('Format file backup tidak sesuai');
  if(!confirm('Tambahkan data dari backup ('+p.kk.length+' KK, '+p.kas.length+' kas, '+p.ronda.length+' ronda, '+p.pinjam.length+' pinjam, '+p.info.length+' info)?'))return;
  if(DEMO){
   var dm={};
   p.kk.forEach(function(k){var id=demoNid('kk');dm[k.id]=id;D.kk.push({id:id,nama:String(k.nama||'Warga').trim()||'Warga',blok:String(k.blok||''),hp:normHp(k.hp)})});
   p.kas.forEach(function(x){D.kas.push({id:demoNid('kas'),tgl:x.tgl||today(),ket:String(x.ket||'Transaksi'),jenis:x.jenis==='keluar'?'keluar':'masuk',jml:Math.max(1,Math.round(Number(x.jml)||1))})});
   p.ronda.forEach(function(r){var kid=dm[r.kk_id!=null?r.kk_id:r.kk];if(kid&&HARI.indexOf(r.hari)>=0)D.ronda.push({id:demoNid('ronda'),hari:r.hari,kk_id:kid})});
   p.pinjam.forEach(function(x){var kid=dm[x.kk_id!=null?x.kk_id:x.kk],ten=Math.max(1,Math.floor(Number(x.tenor)||1)),byr=Math.min(ten,Math.max(0,Math.floor(Number(x.bayar)||0)));if(kid)D.pinjam.push({id:demoNid('pinjam'),kk_id:kid,tgl:x.tgl||today(),pokok:Math.max(1,Math.round(Number(x.pokok)||1)),tenor:ten,bunga:Math.max(0,Number(x.bunga)||0),bayar:byr})});
   p.info.forEach(function(i){D.info.push({id:demoNid('info'),judul:String(i.judul||'Info'),isi:String(i.isi||'-'),tgl:i.tgl||today()})});
   saveDemoData();setMsg('Backup berhasil dipulihkan ke mode demo.',true);render();return;
  }
  BUSY=true;clearMsg();render();
  var kkMap={};
  if(p.kk.length){
   var kkPay=p.kk.map(function(k){return{nama:String(k.nama||'Warga').trim()||'Warga',blok:String(k.blok||''),hp:normHp(k.hp)}});
   var insK=await sb.from('kk').insert(kkPay).select('id').order('id',{ascending:true});
   if(insK.error)throw insK.error;
   p.kk.forEach(function(oldK,idx){if(insK.data[idx])kkMap[oldK.id]=insK.data[idx].id});
  }
  var jobs=[];
  if(p.kas.length){
   jobs.push(sb.from('kas').insert(p.kas.map(function(x){return{tgl:x.tgl||today(),ket:String(x.ket||'Transaksi'),jenis:x.jenis==='keluar'?'keluar':'masuk',jml:Math.max(1,Math.round(Number(x.jml)||1))}})));
  }
  var rondaRows=p.ronda.map(function(r){return{hari:r.hari,kk_id:kkMap[r.kk_id!=null?r.kk_id:r.kk]}}).filter(function(r){return r.kk_id&&HARI.indexOf(r.hari)>=0});
  if(rondaRows.length)jobs.push(sb.from('ronda').insert(rondaRows));
  var pinjamRows=p.pinjam.map(function(x){
   var ten=Math.max(1,Math.floor(Number(x.tenor)||1)),byr=Math.min(ten,Math.max(0,Math.floor(Number(x.bayar)||0)));
   return{kk_id:kkMap[x.kk_id!=null?x.kk_id:x.kk],tgl:x.tgl||today(),pokok:Math.max(1,Math.round(Number(x.pokok)||1)),tenor:ten,bunga:Math.max(0,Number(x.bunga)||0),bayar:byr};
  }).filter(function(x){return x.kk_id});
  if(pinjamRows.length)jobs.push(sb.from('pinjam').insert(pinjamRows));
  if(p.info.length){
   jobs.push(sb.from('info').insert(p.info.map(function(i){return{judul:String(i.judul||'Info'),isi:String(i.isi||'-'),tgl:i.tgl||today()}})));
  }
  var res=await Promise.all(jobs);
  for(var j=0;j<res.length;j++){if(res[j].error)throw res[j].error}
  setMsg('Backup berhasil dipulihkan ke Supabase.',true);
  await loadAll();
 }catch(e){
  setMsg('Gagal restore: '+(e.message||e));
  if(m)m.textContent='Gagal restore: '+(e.message||e);
 }finally{BUSY=false;render()}
}

function exp(){

async function del(t,id){
 var warn='Hapus data ini?';
 if(t==='kk'){
  var cr=D.ronda.filter(function(r){return r.kk_id===id}).length;
  var cp=D.pinjam.filter(function(p){return p.kk_id===id}).length;
  if(cr||cp)warn='Hapus KK ini? '+cr+' jadwal ronda dan '+cp+' data pinjaman milik KK ini juga akan ikut terhapus.';
 }
 if(!confirm(warn))return;
 if(DEMO){
  D[t]=D[t].filter(function(x){return x.id!==id});
  if(t==='kk'){D.ronda=D.ronda.filter(function(r){return r.kk_id!==id});D.pinjam=D.pinjam.filter(function(p){return p.kk_id!==id})}
  if(EDIT&&EDIT.t===t&&EDIT.id===id)EDIT=null;
  saveDemoData();setMsg('Data demo dihapus.',true);render();return;
 }
 BUSY=true;clearMsg();render();
 try{
  var r=await sb.from(t).delete().eq('id',id);
  if(r.error)throw r.error;
  if(EDIT&&EDIT.t===t&&EDIT.id===id)EDIT=null;
  setMsg('Data berhasil dihapus.',true);
  await loadAll();
 }catch(e){setMsg('Gagal menghapus: '+(e.message||e))}
 finally{BUSY=false;render()}
}
